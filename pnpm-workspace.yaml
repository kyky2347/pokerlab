packages:
  - "apps/*"
  - "packages/*"

overrides:
  # GHSA-3wwx-pv8p-q78v: patch the affected jsdom test dependency.
  "undici@>=8.1.0 <8.10.2": "8.10.2"
  # Patch recursion and expansion DoS in the installed 1.x / 5.x toolchain branches.
  "brace-expansion@>=1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  # GHSA-68fv-2mgg-jv7q: validate indexed source-map section offsets.
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"

allowBuilds:
  unrs-resolver: set this to true or false

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
