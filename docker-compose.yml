services:
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Run ./pokerlab to generate local configuration}:${POSTGRES_PASSWORD:?Run ./pokerlab to generate local configuration}@postgres:5432/${POSTGRES_DB:?Run ./pokerlab to generate local configuration}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      POKERLAB_MAX_MONTE_CARLO: ${POKERLAB_MAX_MONTE_CARLO:-500000}
      POKERLAB_MAX_SOLVER_ITERATIONS: ${POKERLAB_MAX_SOLVER_ITERATIONS:-5000}
      POKERLAB_MAX_CONCURRENT_SOLVERS: ${POKERLAB_MAX_CONCURRENT_SOLVERS:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run ./pokerlab to generate local configuration}
      POSTGRES_USER: ${POSTGRES_USER:?Run ./pokerlab to generate local configuration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./pokerlab to generate local configuration}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pokerlab-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pokerlab-postgres:
