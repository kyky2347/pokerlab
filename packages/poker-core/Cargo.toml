[package]
name = "poker-core-rs"
version = "1.0.0"
edition = "2024"
description = "PokerLab's dependency-free card and Hold'em evaluator core"
license = "MIT"

[lib]
name = "poker_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", optional = true }

[features]
default = []
python = ["dep:pyo3", "pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
