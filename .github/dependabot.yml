version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/apps/api"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/packages/poker-core"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
