name: quality

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pokerlab
          POSTGRES_DB: pokerlab_test
          # Disposable runner-only database, never a deployment credential.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U pokerlab -d pokerlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@11.19.0
      - run: python -m pip install uv==0.9.30
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - run: sh -n ./pokerlab && ./pokerlab help >/dev/null
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cd apps/api && uv sync --frozen
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web format:check
      - run: pnpm --filter web build
      - run: cd apps/api && uv run ruff format --check . && uv run ruff check . && uv run pytest
        env:
          POKERLAB_TEST_POSTGRES_URL: postgresql+psycopg://pokerlab@localhost:5432/pokerlab_test
      - run: cargo fmt --manifest-path packages/poker-core/Cargo.toml --check
      - run: cargo test --manifest-path packages/poker-core/Cargo.toml

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@11.19.0
      - run: python -m pip install uv==0.9.30
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cd apps/api && uv sync --frozen
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f infra/api.Dockerfile -t pokerlab-api:test .
      - run: docker build -f infra/web.Dockerfile -t pokerlab-web:test .
