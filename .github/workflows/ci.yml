name: quality

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cd apps/api && uv sync --frozen
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web format:check
      - run: pnpm --filter web build
      - run: cd apps/api && uv run ruff format --check . && uv run ruff check . && uv run pytest
      - run: cargo fmt --manifest-path packages/poker-core/Cargo.toml --check
      - run: cargo test --manifest-path packages/poker-core/Cargo.toml

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cd apps/api && uv sync --frozen
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infra/api.Dockerfile -t pokerlab-api:test .
      - run: docker build -f infra/web.Dockerfile -t pokerlab-web:test .
