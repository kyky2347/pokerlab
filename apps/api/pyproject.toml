[project]
name = "pokerlab-api"
version = "1.0.0"
description = "PokerLab reference probability engine and FastAPI service"
license = "MIT"
authors = [{ name = "PokerLab contributors" }]
keywords = ["poker", "probability", "monte-carlo", "cfr", "education"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "numpy>=2.3",
  "scipy>=1.16",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "python-multipart>=0.0.20",
  "psycopg[binary]>=3.2",
  "poker-core-rs>=1.0.0",
]

[tool.uv.sources]
poker-core-rs = { path = "../../packages/poker-core", editable = true }

[project.urls]
Repository = "https://github.com/kyky2347/project-s8qftxtm"
Documentation = "https://github.com/kyky2347/project-s8qftxtm#readme"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "hypothesis>=6.138",
  "httpx>=0.28",
  "ruff>=0.12",
  "maturin>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokerlab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI's dependency injection intentionally uses Depends defaults.
